<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Проверка финального логотипа Vidno</title>
  <desc id="desc">Финальный логотип Vidno на светлом и тёмном фоне и в малых размерах</desc>
  <defs>
