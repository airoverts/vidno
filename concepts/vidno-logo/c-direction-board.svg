<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Новое минималистичное направление логотипа Vidno</title>
  <desc id="desc">Три варианта знака из асимметричных лучей и отдельной точки-сигнала</desc>
  <defs>
    <g id="beacon">
      <path d="M9 8H38L55 67L45 77Z" fill="#028090"/>
      <path d="M95 13L73 19L58 67L65 73Z" fill="#028090"/>
      <circle cx="55" cy="87" r="8" fill="#028090"/>
    </g>
    <g id="focus">
      <path d="M10 9H35L52 65L44 74Z" fill="#028090"/>
      <path d="M94 9H73L57 65L64 74Z" fill="#028090"/>
      <circle cx="54" cy="86" r="7.5" fill="#028090"/>
    </g>
    <g id="capture">
      <path d="M9 9H37L53 61L44 71Z" fill="#028090"/>
      <path d="M95 16L74 20L58 61L65 69Z" fill="#028090"/>
      <circle cx="55" cy="72" r="7" fill="#028090"/>
    </g>
  </defs>
  <rect width="1200" height="760" fill="#EAF6F5"/>
  <text x="60" y="65" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Vidno · минимализм без «буквы с дыркой»</text>
  <text x="60" y="98" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="16">Знак складывается из лучей и отдельного найденного сигнала — V возникает только в движении формы</text>

  <g transform="translate(60 140)">
    <rect width="340" height="470" rx="22" fill="#FFFFFF"/>
    <text x="26" y="42" fill="#028090" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">C1 · BEACON</text>
    <text x="314" y="42" text-anchor="end" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="12">асимметрия</text>
    <g transform="translate(107 70) scale(1.22)"><use href="#beacon"/></g>
    <text x="170" y="257" text-anchor="middle" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-2">Vidno</text>
    <line x1="26" y1="292" x2="314" y2="292" stroke="#E2E8E8"/>
    <text x="26" y="326" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Два луча находят сигнал</text>
    <text x="26" y="350" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="13">Характер ближе всего к исходной идее</text>
    <g transform="translate(27 383) scale(.56)"><use href="#beacon"/></g>
    <g transform="translate(113 395) scale(.4)"><use href="#beacon"/></g>
    <g transform="translate(184 405) scale(.28)"><use href="#beacon"/></g>
    <text x="255" y="432" fill="#028090" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">ВЫБОР</text>
  </g>

  <g transform="translate(430 140)">
    <rect width="340" height="470" rx="22" fill="#FFFFFF"/>
    <text x="26" y="42" fill="#028090" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">C2 · FOCUS</text>
    <text x="314" y="42" text-anchor="end" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="12">ровнее</text>
    <g transform="translate(107 70) scale(1.22)"><use href="#focus"/></g>
    <text x="170" y="257" text-anchor="middle" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-2">Vidno</text>
    <line x1="26" y1="292" x2="314" y2="292" stroke="#E2E8E8"/>
    <text x="26" y="326" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Более собранный фокус</text>
    <text x="26" y="350" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="13">Чище, но чуть ближе к обычной V</text>
    <g transform="translate(27 383) scale(.56)"><use href="#focus"/></g>
    <g transform="translate(113 395) scale(.4)"><use href="#focus"/></g>
    <g transform="translate(184 405) scale(.28)"><use href="#focus"/></g>
  </g>

  <g transform="translate(800 140)">
    <rect width="340" height="470" rx="22" fill="#FFFFFF"/>
    <text x="26" y="42" fill="#028090" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">C3 · CAPTURE</text>
    <text x="314" y="42" text-anchor="end" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="12">компактный</text>
    <g transform="translate(107 70) scale(1.22)"><use href="#capture"/></g>
    <text x="170" y="257" text-anchor="middle" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-2">Vidno</text>
    <line x1="26" y1="292" x2="314" y2="292" stroke="#E2E8E8"/>
    <text x="26" y="326" fill="#012533" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Сигнал пойман между лучами</text>
    <text x="26" y="350" fill="#5B6B6D" font-family="Inter, Arial, sans-serif" font-size="13">Самый компактный, меньше воздуха</text>
    <g transform="translate(27 383) scale(.56)"><use href="#capture"/></g>
    <g transform="translate(113 395) scale(.4)"><use href="#capture"/></g>
    <g transform="translate(184 405) scale(.28)"><use href="#capture"/></g>
  </g>

  <rect x="60" y="642" width="1080" height="58" rx="18" fill="#012533"/>
  <g transform="translate(84 653) scale(.4)">
    <path d="M9 8H38L55 67L45 77Z" fill="#FFFFFF"/>
    <path d="M95 13L73 19L58 67L65 73Z" fill="#FFFFFF"/>
    <circle cx="55" cy="87" r="8" fill="#FFFFFF"/>
  </g>
  <text x="140" y="681" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-1">Vidno</text>
  <text x="1110" y="678" text-anchor="end" fill="#CFF3EF" font-family="Inter, Arial, sans-serif" font-size="13">плоский цвет · без градиента · без буквального контура V</text>
</svg>
